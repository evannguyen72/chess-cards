{% extends "base.html" %}
{% block title %}Game #{{ game.id }} · Chess Cards{% endblock %}
{% block body_attrs %}data-game-id="{{ game.id }}"{% endblock %}
{% block content %}
<section class="game-layout">
  <div class="board-wrap">
    <div class="player-bar" id="top-player"></div>
    <div id="board" class="board"></div>
    <div class="player-bar" id="bottom-player"></div>
  </div>

  <aside class="panel side">
    <div id="status" class="status"></div>
    <div id="draw-offer" class="draw-offer hidden">
      Your opponent offered a draw.
      <div class="row">
        <button class="btn small primary" data-draw="accept">Accept</button>
        <button class="btn small" data-draw="decline">Decline</button>
      </div>
    </div>
    <label class="small">Promote pawns to
      <select id="promo">
        <option value="q">Queen</option><option value="r">Rook</option>
        <option value="b">Bishop</option><option value="n">Knight</option>
      </select>
    </label>
    <div class="row">
      <button id="offer-draw" class="btn small">Offer draw</button>
      <button id="resign" class="btn small danger">Resign</button>
    </div>
    <h3>Moves</h3>
    <ol id="moves" class="moves"></ol>
    <div id="game-over" class="game-over hidden"></div>
    <p id="error" class="error"></p>
  </aside>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='game.js') }}"></script>{% endblock %}
